  Paper discussions and guest talks on computer vision and machine learning,
  with a focus on human motion and health applications. Hosted at the
  University of Toronto, KITE, and the Vector Institute
  [since 2019](https://www.cs.toronto.edu/~taati/journalclub.html).
  Open to anyone interested, from any lab.

